[package]
name = "periodic-instruments"
version = "0.1.0"
edition = "2021"
authors = ["AlZrSe"]
description = "Periodic Instruments - A VST3 synthesizer with 94 elemental voices"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AlZr/periodic-instruments"
categories = ["audio", "multimedia", "gui"]
keywords = ["vst3", "synthesizer", "audio-plugin", "iced"]

[lib]
name = "periodic_instruments"
crate-type = ["cdylib", "rlib"]

[dependencies]
# VST3 plugin framework with iced GUI support
nice-plug = { version = "0.4", features = ["vst3", "editor"] }

# GUI framework (re-exported via nice-plug)
iced = { version = "0.12", features = ["default", "wgpu", "tokio"] }

# Atomic floats for lock-free parameter sharing
atomic_float = "1.1"

# Lock-free synchronization
parking_lot = "0.12"



# UID/FUID generation
uid = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization for presets
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# File system utilities
dirs = "5.0"

[build-dependencies]
vst3 = "0.3"

[dev-dependencies]
vst3-host = { version = "0.11", features = ["process-isolation"] }
junit-report = "0.2"
tempfile = "3.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tokio = { version = "1.0", features = ["rt", "time", "process", "fs", "sync"] }
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = true
panic = "abort"

[profile.release.with-debug]
inherits = "release"
debug = true

[features]
default = ["vst3"]
vst3 = ["nice-plug/vst3"]

# For testing without GUI
headless = []

# Test-only feature for fault injection (process isolation verification)
crash-injection = []

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Console"] }

[workspace]
members = []

[workspace.lints.rust]
unused_crate_dependencies = "warn"
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"